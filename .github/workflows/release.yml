name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build the Windows and Linux zips and publish them
# as a GitHub release. Run it by hand (Actions → Release → Run workflow) to only build the zips as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for rid in win-x64 linux-x64; do
            name="F1Telemetry-$VERSION-$rid"
            dotnet publish src/F1Telemetry.App -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              -p:Version="$VERSION" -o "dist/$name"
            rm -f dist/$name/*.pdb
            cp README.md src/F1Telemetry.App/Assets/Fonts/OFL.txt "dist/$name/"
            if [[ "$rid" == linux-* ]]; then chmod +x "dist/$name/F1Telemetry"; fi
            (cd dist && zip -qr "$name.zip" "$name")
          done
          ls -la dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: F1Telemetry-${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
